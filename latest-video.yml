name: Update latest video

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch:          # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read the channel's newest video from its YouTube feed
        run: |
          python3 - <<'PY'
          import json, re, urllib.request
          CHANNEL_ID = "UCoU4ZvUmkcyaUZl4JeA4GqA"
          url = "https://www.youtube.com/feeds/videos.xml?channel_id=" + CHANNEL_ID
          xml = urllib.request.urlopen(url, timeout=30).read().decode("utf-8")
          m = re.search(r"<yt:videoId>([^<]+)</yt:videoId>", xml)
          if not m:
              print("No videos found in the feed; leaving latest.json unchanged.")
          else:
              with open("latest.json", "w") as f:
                  json.dump({"id": m.group(1)}, f)
              print("Latest video:", m.group(1))
          PY

      - name: Save it if it changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Update latest video" && git push)
