  body::after {

  /* falling petals */
  .petals { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .petal {
    position: absolute; top: -40px;
    width: 14px; height: 11px;
    background: linear-gradient(135deg, #ffc4d4, #f59ab4);
    border-radius: 80% 0 80% 0;
    opacity: .75;
    animation: fall linear infinite;
  }
  @keyframes fall {
    0%   { transform: translate(0, -40px) rotate(0deg); }
    50%  { transform: translate(40px, 50vh) rotate(180deg); }
    100% { transform: translate(-20px, 105vh) rotate(360deg); }
  }
  @media (prefers-reduced-motion: reduce) { .petal { display: none; } }

  .wrap {

    max-width: 520px; margin: 0 auto;

  /* paper card */
  .card {

    background:

      linear-gradient(90deg, var(--line) 1px, transparent 1px) 0 0 / 26px 100%,

    border-radius: 22px;
    -webkit-backdrop-filter: blur(6px);
    backdrop-filter: blur(6px);
    padding: 92px 22px 26px;
    box-shadow: 0 18px 40px -18px rgba(150, 50, 80, .35), 0 2px 0 rgba(255,255,255,.8) inset;

  .tape {

  .featured {

  .featured:hover, .featured:focus-visible { transform: rotate(0) scale(1.015); }
  .thumb {

    background: linear-gradient(135deg, #2a2236, #3b2b44);
    display: grid; place-items: center; position: relative; overflow: hidden;
  }
  .thumb .play { z-index: 1; }
  .thumb::before {
    content: ""; position: absolute; inset: 0;
    background: radial-gradient(circle at 70% 30%, rgba(242,122,155,.45), transparent 55%);

  .play {

  .play::after { content: ""; border-left: 18px solid var(--pink-deep); border-top: 11px solid transparent; border-bottom: 11px solid transparent; margin-left: 5px; }
  .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .featured p { font-family: "Caveat", cursive; font-size: 23px; text-align: center; margin-top: 8px; }

  /* links */

  .link {

  .ico {

  .txt { flex: 1; min-width: 0; }
